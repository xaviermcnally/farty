<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent Fart Simulator</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:black;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:28px;
    z-index:10;
    text-shadow:2px 2px 6px black;
}

#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:24px;
    z-index:10;
}

#loseScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    z-index:20;
}

#loseScreen h1{
    font-size:70px;
    margin:0;
}

button{
    padding:15px 35px;
    font-size:28px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
    Time Until Auto Fart:
    <span id="timer">10</span>
    <br>
    Mic Loudness:
    <span id="mic">0</span>
</div>

<div id="crosshair">•</div>

<div id="loseScreen">
    <h1>THE CLASS HEARD YOU 💀</h1>
    <br>
    <button onclick="retryGame()">Retry</button>
</div>

<script type="module">

//////////////////////////////////////////////////////////
// IMPORT THREEJS
//////////////////////////////////////////////////////////

import * as THREE from 'https://unpkg.com/three@0.152.2/build/three.module.js';

//////////////////////////////////////////////////////////
// SCENE
//////////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xa8f0d1);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

//////////////////////////////////////////////////////////
// LIGHTING
//////////////////////////////////////////////////////////

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sun.position.set(20,30,20);

sun.castShadow = true;

scene.add(sun);

scene.add(new THREE.AmbientLight(
    0xffffff,
    0.7
));

//////////////////////////////////////////////////////////
// FLOOR
//////////////////////////////////////////////////////////

const floor = new THREE.Mesh(
    new THREE.BoxGeometry(70,1,70),
    new THREE.MeshPhongMaterial({
        color:0x8b2c66
    })
);

floor.position.y = -1;

floor.receiveShadow = true;

scene.add(floor);

//////////////////////////////////////////////////////////
// WALLS
//////////////////////////////////////////////////////////

function makeWall(w,h,d,x,y,z,color){

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        new THREE.MeshPhongMaterial({
            color
        })
    );

    wall.position.set(x,y,z);

    scene.add(wall);
}

makeWall(70,20,1,0,9,-35,0x7fe0a7);
makeWall(70,20,1,0,9,35,0x7fe0a7);
makeWall(1,20,70,-35,9,0,0x73d89a);
makeWall(1,20,70,35,9,0,0x73d89a);

//////////////////////////////////////////////////////////
// WINDOWS
//////////////////////////////////////////////////////////

for(let i=-22;i<=0;i+=11){

    const frame = new THREE.Mesh(
        new THREE.BoxGeometry(7,6,0.5),
        new THREE.MeshPhongMaterial({
            color:0xffffff
        })
    );

    frame.position.set(i,9,-34.5);

    scene.add(frame);

    const glass = new THREE.Mesh(
        new THREE.BoxGeometry(6.2,5.2,0.1),
        new THREE.MeshPhongMaterial({
            color:0x87ceeb,
            transparent:true,
            opacity:0.7
        })
    );

    glass.position.set(i,9,-34.2);

    scene.add(glass);
}

//////////////////////////////////////////////////////////
// WHITEBOARD
//////////////////////////////////////////////////////////

const board = new THREE.Mesh(
    new THREE.BoxGeometry(18,6,0.2),
    new THREE.MeshPhongMaterial({
        color:0xffffff
    })
);

board.position.set(0,10,-34);

scene.add(board);

//////////////////////////////////////////////////////////
// CLOCK
//////////////////////////////////////////////////////////

const clock = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5,1.5,0.3,32),
    new THREE.MeshPhongMaterial({
        color:0xff55cc
    })
);

clock.rotation.x = Math.PI/2;

clock.position.set(24,15,-34);

scene.add(clock);

//////////////////////////////////////////////////////////
// POSTERS
//////////////////////////////////////////////////////////

function poster(x,y,z,color){

    const p = new THREE.Mesh(
        new THREE.BoxGeometry(4,5,0.1),
        new THREE.MeshPhongMaterial({
            color
        })
    );

    p.position.set(x,y,z);

    scene.add(p);
}

poster(16,10,-34,0x222288);
poster(10,8,-34,0xffaa00);
poster(-24,12,-34,0x000000);

//////////////////////////////////////////////////////////
// DESKS
//////////////////////////////////////////////////////////

function desk(x,z){

    const top = new THREE.Mesh(
        new THREE.BoxGeometry(4,0.4,3),
        new THREE.MeshPhongMaterial({
            color:0xff99dd
        })
    );

    top.position.set(x,2,z);

    top.castShadow = true;

    scene.add(top);

    for(let lx=-1.5; lx<=1.5; lx+=3){

        for(let lz=-1; lz<=1; lz+=2){

            const leg = new THREE.Mesh(
                new THREE.BoxGeometry(0.2,3,0.2),
                new THREE.MeshPhongMaterial({
                    color:0x2244aa
                })
            );

            leg.position.set(x+lx,0.5,z+lz);

            scene.add(leg);
        }
    }

    //////////////////////////////////////////////////////
    // CHAIR
    //////////////////////////////////////////////////////

    const chair = new THREE.Mesh(
        new THREE.BoxGeometry(1.8,0.3,1.8),
        new THREE.MeshPhongMaterial({
            color:0xffb6e6
        })
    );

    chair.position.set(x,0.8,z+3);

    scene.add(chair);
}

//////////////////////////////////////////////////////////
// STUDENTS
//////////////////////////////////////////////////////////

const shirtColors = [
0x223388,
0xaa3333,
0x228855,
0xaa8822,
0x555555
];

const hairColors = [
0x111111,
0x553311,
0xddcc88
];

function student(x,z){

    desk(x,z);

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.7,3,1.2),
        new THREE.MeshPhongMaterial({
            color:shirtColors[
                Math.floor(Math.random()*shirtColors.length)
            ]
        })
    );

    body.position.set(x,3.7,z+2.3);

    scene.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.8,32,32),
        new THREE.MeshPhongMaterial({
            color:0xffcc99
        })
    );

    head.position.set(x,6,z+2.3);

    scene.add(head);

    const hair = new THREE.Mesh(
        new THREE.SphereGeometry(0.82,32,32),
        new THREE.MeshPhongMaterial({
            color:hairColors[
                Math.floor(Math.random()*hairColors.length)
            ]
        })
    );

    hair.scale.y = 0.5;

    hair.position.set(x,6.4,z+2.3);

    scene.add(hair);
}

for(let x=-18;x<=18;x+=9){

    for(let z=-16;z<=10;z+=9){

        student(x,z);
    }
}

//////////////////////////////////////////////////////////
// TEACHER
//////////////////////////////////////////////////////////

const teacherBody = new THREE.Mesh(
    new THREE.BoxGeometry(2.2,4,1.4),
    new THREE.MeshPhongMaterial({
        color:0x663399
    })
);

teacherBody.position.set(0,4,-23);

scene.add(teacherBody);

const teacherHead = new THREE.Mesh(
    new THREE.SphereGeometry(1,32,32),
    new THREE.MeshPhongMaterial({
        color:0xffcc99
    })
);

teacherHead.position.set(0,7,-23);

scene.add(teacherHead);

//////////////////////////////////////////////////////////
// PLAYER DESK
//////////////////////////////////////////////////////////

const playerDesk = new THREE.Mesh(
    new THREE.BoxGeometry(9,0.5,7),
    new THREE.MeshPhongMaterial({
        color:0xff99dd
    })
);

playerDesk.position.set(0,1.5,22);

scene.add(playerDesk);

//////////////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////////////

camera.position.set(0,7,30);

//////////////////////////////////////////////////////////
// GAME VARIABLES
//////////////////////////////////////////////////////////

let fartTimer = 10;
let micVolume = 0;
let gameOver = false;

//////////////////////////////////////////////////////////
// LOAD FART SOUND
//////////////////////////////////////////////////////////

const fartSound = new Audio("fart.mp3");

//////////////////////////////////////////////////////////
// MICROPHONE
//////////////////////////////////////////////////////////

navigator.mediaDevices.getUserMedia({
    audio:true
})
.then(stream=>{

    const ctx = new AudioContext();

    const source =
    ctx.createMediaStreamSource(stream);

    const analyser =
    ctx.createAnalyser();

    analyser.fftSize = 256;

    source.connect(analyser);

    const data =
    new Uint8Array(
        analyser.frequencyBinCount
    );

    function updateMic(){

        analyser.getByteFrequencyData(data);

        let values = 0;

        for(let i=0;i<data.length;i++){

            values += data[i];
        }

        micVolume = values/data.length;

        document.getElementById("mic").innerText =
        Math.floor(micVolume);

        requestAnimationFrame(updateMic);
    }

    updateMic();
});

//////////////////////////////////////////////////////////
// FART
//////////////////////////////////////////////////////////

function fart(){

    if(gameOver) return;

    fartSound.currentTime = 0;

    fartSound.play();

    //////////////////////////////////////////////////////
    // CHECK IF PLAYER COUGHED
    //////////////////////////////////////////////////////

    if(micVolume < 35){

        lose();
    }

    fartTimer = 10;
}

//////////////////////////////////////////////////////////
// LOSE
//////////////////////////////////////////////////////////

function lose(){

    gameOver = true;

    document.getElementById("loseScreen")
    .style.display = "flex";
}

//////////////////////////////////////////////////////////
// RETRY
//////////////////////////////////////////////////////////

window.retryGame = function(){

    gameOver = false;

    fartTimer = 10;

    document.getElementById("loseScreen")
    .style.display = "none";
}

//////////////////////////////////////////////////////////
// TIMER
//////////////////////////////////////////////////////////

setInterval(()=>{

    if(gameOver) return;

    fartTimer--;

    document.getElementById("timer")
    .innerText = fartTimer;

    if(fartTimer <= 0){

        fart();
    }

},1000);

//////////////////////////////////////////////////////////
// SPACEBAR
//////////////////////////////////////////////////////////

document.addEventListener("keydown",(e)=>{

    if(e.code === "Space"){

        fart();
    }
});

//////////////////////////////////////////////////////////
// ANIMATION
//////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    renderer.render(scene,camera);
}

animate();

//////////////////////////////////////////////////////////
// RESIZE
//////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect =
    window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
